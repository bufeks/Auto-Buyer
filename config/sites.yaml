# アパレルECサイト設定ファイル
# enabled: true のサイトのみスクレイピングされます。
#
# type: shopify  → Shopify の products.json エンドポイントを使用（推奨・安定）
# type: generic  → CSS セレクタで任意サイトを取得
# type: demo     → ローカルテスト用モックデータ

sites:

  # ── SUPPLY TOKYO ──────────────────────────────────────────────
  - name: "SUPPLY TOKYO"
    type: shopify
    url: "https://supply-tokyo.com"
    collection: "new-arrivals"   # /collections/<collection>/products.json を取得
    interval_minutes: 10
    enabled: true

  # ── MIYAGEN ───────────────────────────────────────────────────
  - name: "MIYAGEN"
    type: shopify
    url: "https://miyagen.com"
    # collection 未指定 → /products.json を使用
    interval_minutes: 10
    enabled: true

  # ── 瓦奇岳 (KAWARAKIDAKE) ─────────────────────────────────────
  - name: "瓦奇岳"
    type: shopify
    url: "https://kawarakidake.com"
    # collection 未指定 → /products.json を使用
    interval_minutes: 10
    enabled: true

  # ── DIGAWEL ───────────────────────────────────────────────────
  - name: "DIGAWEL"
    type: shopify
    url: "https://store.digawel.com"
    # collection 未指定 → /products.json を使用
    interval_minutes: 10
    enabled: true

  # ── 山荘飯島 (SANSO IIJIMA) ────────────────────────────────────
  - name: "山荘飯島"
    type: shopify
    url: "https://sanso-iijima.com"
    # /collections/all/products.json は503のため /products.json を使用
    interval_minutes: 10
    enabled: true

  # ── TMB (TakaoMountainBook) ───────────────────────────────────
  - name: "TMB"
    type: playwright        # BASE製サイト（JSレンダリング）
    url: "https://tmb.official.ec/"
    interval_minutes: 10
    enabled: true
    selectors:
      container: "li[class*='itemListLI']"      # 商品カード
      name: "p[class*='itemTitleText']"          # 商品名
      price: "p[class*='_price_']"               # 価格
      image: "img[class*='_image_']"             # 画像
      link: "a[class*='_anchor_']"               # 商品リンク
      sold_out: "p[class*='soldOut']"            # SOLD OUTバッジ

  # ── HIKER WORKSHOP ────────────────────────────────────────────
  - name: "HIKER WORKSHOP"
    type: shopify
    url: "https://hikerworkshop.jp"
    interval_minutes: 10
    enabled: true

  # ── DEVELOPMENT BY NOROLL ─────────────────────────────────────
  - name: "DEVELOPMENT BY NOROLL"
    type: shopify
    url: "https://developmentbynoroll.space"
    interval_minutes: 10
    enabled: true

  # ── ZENTEX TOKYO ──────────────────────────────────────────────
  - name: "ZENTEX TOKYO"
    type: shopify
    url: "https://zentex-tokyo.com"
    interval_minutes: 10
    enabled: true

  # ── FRIDGE SETAGAYA ───────────────────────────────────────────
  - name: "FRIDGE"
    type: generic
    url: "https://fridgesetagaya.shop-pro.jp/"
    interval_minutes: 10
    enabled: true
    selectors:
      container: "li[class*='item_list']"
      name: "span.item_name"
      price: "span.item_price"
      image: "img.item_img"
      link: "a[href*='?pid=']"
      sold_out: "span.item_soldout"

  # ── BAL ORIGINAL ──────────────────────────────────────────────
  - name: "BAL"
    type: generic
    url: "https://baloriginal.com/items"
    interval_minutes: 10
    enabled: true
    selectors:
      container: "a.product"
      name: "p.p_name"
      price: "p.p_price span"
      image: "div.p_img img"
      sold_out_class: "sold_out"   # コンテナ自身のクラスで判定

  # ── ULTRA GOOD LUCK (UGL) ─────────────────────────────────────
  - name: "UGL"
    type: generic
    url: "https://ugl.official.ec/"
    interval_minutes: 10
    enabled: true
    selectors:
      container: "div.item"
      name: "div.itemTitle h2"
      price: "li.itemPrice div"
      image: "div.itemThumbImg img"
      link: "a[href*='/items/']"
      sold_out: "p.endOfSale"

  # ── noook ──────────────────────────────────────────────────────
  - name: "noook"
    type: shopify
    url: "https://noook.jp"
    interval_minutes: 10
    enabled: true

  # ── PRODUCT TWELVE ────────────────────────────────────────────
  - name: "PRODUCT TWELVE"
    type: shopify
    url: "https://producttwelve.shop"
    interval_minutes: 10
    enabled: true

