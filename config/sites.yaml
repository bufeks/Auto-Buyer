# アパレルECサイト設定ファイル
# enabled: true のサイトのみスクレイピングされます。
#
# type: shopify  → Shopify の products.json エンドポイントを使用（推奨・安定）
# type: generic  → CSS セレクタで任意サイトを取得
# type: demo     → ローカルテスト用モックデータ

sites:

  # ── SUPPLY TOKYO ──────────────────────────────────────────────
  - name: "SUPPLY TOKYO"
    type: shopify
    url: "https://supply-tokyo.com"
    collection: "new-arrivals"   # /collections/<collection>/products.json を取得
    limit: 50                    # 最大取得件数
    interval_minutes: 30
    enabled: true

  # ── MIYAGEN ───────────────────────────────────────────────────
  - name: "MIYAGEN"
    type: shopify
    url: "https://miyagen.com"
    # collection 未指定 → /products.json を使用
    limit: 50
    interval_minutes: 30
    enabled: true

  # ── 瓦奇岳 (KAWARAKIDAKE) ─────────────────────────────────────
  - name: "瓦奇岳"
    type: shopify
    url: "https://kawarakidake.com"
    # collection 未指定 → /products.json を使用
    limit: 50
    interval_minutes: 30
    enabled: true

  # ── DIGAWEL ───────────────────────────────────────────────────
  - name: "DIGAWEL"
    type: shopify
    url: "https://store.digawel.com"
    # collection 未指定 → /products.json を使用
    limit: 50
    interval_minutes: 30
    enabled: true

  # ── 山荘飯島 (SANSO IIJIMA) ────────────────────────────────────
  - name: "山荘飯島"
    type: shopify
    url: "https://sanso-iijima.com"
    # /collections/all/products.json は503のため /products.json を使用
    limit: 50
    interval_minutes: 30
    enabled: true

  # ── TMB (TakaoMountainBook) ───────────────────────────────────
  - name: "TMB"
    type: playwright        # BASE製サイト（JSレンダリング）
    url: "https://tmb.official.ec/"
    interval_minutes: 30
    enabled: true
    selectors:
      container: "li[class*='itemListLI']"      # 商品カード
      name: "p[class*='itemTitleText']"          # 商品名
      price: "p[class*='_price_']"               # 価格
      image: "img[class*='_image_']"             # 画像
      link: "a[class*='_anchor_']"               # 商品リンク

  # ── DEVELOPMENT BY NOROLL ─────────────────────────────────────
  - name: "DEVELOPMENT BY NOROLL"
    type: shopify
    url: "https://developmentbynoroll.space"
    limit: 50
    interval_minutes: 30
    enabled: true

  # ── noook ──────────────────────────────────────────────────────
  - name: "noook"
    type: shopify
    url: "https://noook.jp"
    limit: 50
    interval_minutes: 30
    enabled: true

