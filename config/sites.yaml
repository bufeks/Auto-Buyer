# アパレルECサイト設定ファイル
# enabled: true のサイトのみスクレイピングされます。
#
# type: shopify  → Shopify の products.json エンドポイントを使用（推奨・安定）
# type: generic  → CSS セレクタで任意サイトを取得
# type: demo     → ローカルテスト用モックデータ

sites:

  # ── SUPPLY TOKYO ──────────────────────────────────────────────
  - name: "SUPPLY TOKYO"
    type: shopify
    url: "https://supply-tokyo.com"
    collection: "new-arrivals"   # /collections/<collection>/products.json を取得
    limit: 50                    # 最大取得件数
    interval_minutes: 30
    enabled: true

  # ── MIYAGEN ───────────────────────────────────────────────────
  - name: "MIYAGEN"
    type: shopify
    url: "https://miyagen.com"
    # collection 未指定 → /products.json を使用
    limit: 50
    interval_minutes: 30
    enabled: true

  # ── 瓦奇岳 (KAWARAKIDAKE) ─────────────────────────────────────
  - name: "瓦奇岳"
    type: shopify
    url: "https://kawarakidake.com"
    # collection 未指定 → /products.json を使用
    limit: 50
    interval_minutes: 30
    enabled: true

