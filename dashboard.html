const LOG = [{"id": 1, "site_name": "SUPPLY TOKYO", "scraped_at": "2026-05-08T00:29:46", "items_found": 43, "new_items": 0, "restock_items": 0, "error": null}];

let currentStatus = 'all';
let currentSite = '';

function formatDate(s) { return s ? s.slice(0,16).replace('T',' ') : ''; }

// Populate site filter
const sites = [...new Set(ALL_ITEMS.map(i => i.site_name))].sort();
const sel = document.getElementById('site-filter');
sites.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });

// Update stats
function updateStats(items) {
  const newItems = items.filter(i => !i.is_restock);
  const restockItems = items.filter(i => i.is_restock);
  document.getElementById('stat-new').textContent = newItems.length;
  document.getElementById('stat-restock').textContent = restockItems.length;
  document.getElementById('stat-total').textContent = items.length;
  document.getElementById('count-label').textContent = items.length + ' 件表示中';
  if (LOG.length) document.getElementById('stat-last').textContent = formatDate(LOG[0].scraped_at);
}

function render() {
  let items = ALL_ITEMS.filter(i => i.is_active);
  if (currentSite) items = items.filter(i => i.site_name === currentSite);
  if (currentStatus === 'new') items = items.filter(i => !i.is_restock);
  if (currentStatus === 'restock') items = items.filter(i => i.is_restock);

  updateStats(items);

  const grid = document.getElementById('grid');
  if (!items.length) { grid.innerHTML = '<div class="col-12 text-center py-5 text-muted">アイテムがありません。</div>'; return; }

  grid.innerHTML = items.map(item => `
    <div class="col">
      <div class="card h-100">
        ${item.image_url
          ? `<img src="${item.image_url}" class="card-img-top" alt="${item.name}" loading="lazy" onerror="this.src='https://placehold.co/300x220/eee/999?text=No+Image'">`
          : `<div class="card-img-top d-flex align-items-center justify-content-center bg-light text-muted small">No Image</div>`}
        <div class="card-body p-2">
          <div class="d-flex gap-1 mb-1 flex-wrap">
            ${item.is_restock
              ? '<span class="badge badge-restock">リストック</span>'
              : '<span class="badge badge-new">新着</span>'}
            <span class="badge site-tag">${item.site_name}</span>
          </div>
          <p class="item-name mb-1">${item.name}</p>
          ${item.price ? `<p class="price mb-0">${item.price}</p>` : ''}
          <p class="text-muted mb-0" style="font-size:.7rem;">${formatDate(item.last_seen)}</p>
        </div>
        <div class="card-footer p-2 bg-white border-0">
          <a href="${item.item_url}" target="_blank" rel="noopener" class="btn btn-sm btn-outline-dark w-100">商品ページ</a>
        </div>
      </div>
    </div>
  `).join('');
}

// Filter buttons
document.getElementById('status-filters').addEventListener('click', e => {
  const btn = e.target.closest('[data-status]');
  if (!btn) return;
  currentStatus = btn.dataset.status;
  document.querySelectorAll('[data-status]').forEach(b => {
    b.className = 'btn btn-outline-secondary';
  });
  btn.className = currentStatus === 'all' ? 'btn btn-dark'
    : currentStatus === 'new' ? 'btn btn-success' : 'btn btn-warning';
  render();
});

sel.addEventListener('change', () => { currentSite = sel.value; render(); });
render();
</script>
